<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>帝國藍圖｜集資頁</title>
  <style>
    :root{
      --bg:#0b0f14;
      --card:#111827;
      --muted:#94a3b8;
      --text:#e5e7eb;
      --accent:#f59e0b;
      --accent2:#22c55e;
      --line:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(245,158,11,.18), transparent 55%),
                  radial-gradient(900px 500px at 90% 15%, rgba(34,197,94,.14), transparent 60%),
                  var(--bg);
      color:var(--text);
    }
    a{color:inherit}
    .wrap{max-width:1100px; margin:0 auto; padding:28px 18px 60px;}

    /* Header card */
    header{
      border:1px solid var(--line);
      background:rgba(17,24,39,.65);
      border-radius:18px;
      padding:18px;
      backdrop-filter: blur(10px);
    }
    .headerTop{
      display:flex; gap:16px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;
    }
    .brand h1{margin:0 0 6px; font-size:26px; letter-spacing:.5px}
    .brand p{margin:0; color:var(--muted); line-height:1.5}
    .brand a{
      color:#93c5fd;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid var(--line); border-radius:999px; padding:8px 12px;
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
    }

    .headerProgress{
      margin-top:14px;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between}
    .small{font-size:12px}
    .muted{color:var(--muted)}

    .kpi{
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px;
    }
    @media (max-width: 640px){ .kpi{grid-template-columns:1fr} }
    .kpi .box{
      border:1px solid var(--line); border-radius:14px; padding:12px;
      background:rgba(255,255,255,.03)
    }
    .kpi .num{font-size:20px; font-weight:700; margin-top:4px}

    .progress{
      margin-top:12px;
      height:14px; background:rgba(255,255,255,.06);
      border-radius:999px; overflow:hidden; border:1px solid var(--line);
    }
    .bar{
      height:100%; width:0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius:999px;
      transition: width .8s ease;
    }

    .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
    button{
      cursor:pointer;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
    }
    button:hover{background:rgba(255,255,255,.07)}
    .note{margin-top:10px; color:var(--muted); font-size:12px; line-height:1.6}
    code{background:rgba(0,0,0,.25); padding:2px 6px; border-radius:8px; border:1px solid var(--line)}

    /* Main grid */
    .grid{
      display:grid; gap:14px; margin-top:14px;
      grid-template-columns: 1.2fr .8fr;
      align-items:start;
    }
    @media (max-width: 900px){ .grid{grid-template-columns:1fr} }

    .card{
      border:1px solid var(--line);
      background:rgba(17,24,39,.65);
      border-radius:18px;
      padding:16px;
      backdrop-filter: blur(10px);
    }
    .card h2{margin:0 0 10px; font-size:16px; letter-spacing:.4px}

    /* Backer list */
    .list{
      margin-top:10px; border-top:1px solid var(--line);
    }
    .item{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 2px; border-bottom:1px solid var(--line);
      font-size:13px;
    }
    .item .who{color:var(--text)}
    .item .amt{color:var(--muted); white-space:nowrap}

    /* Tiers */
    .tiers{
      display:grid; gap:10px;
      grid-template-columns: repeat(2, 1fr);
      margin-top:10px;
    }
    @media (max-width: 700px){ .tiers{grid-template-columns:1fr} }
    .tier{
      border:1px solid var(--line); border-radius:16px; padding:12px;
      background:rgba(255,255,255,.03);
    }
    .tier .top{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .badge{
      font-size:12px; padding:6px 10px; border-radius:999px;
      background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.25);
      color:#fde68a;
      white-space:nowrap;
    }
    .tier h3{margin:8px 0 6px; font-size:15px}
    .tier p{margin:0; color:var(--muted); line-height:1.5; font-size:13px}

    /* Tier images + ecpay button */
    .tier .img{
      width:100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      margin-top:10px;
    }
    .tier .img img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
    .tier .pay{ margin-top:10px; }
    .tier .pay a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      text-decoration:none;
      font-size:13px;
      border:1px solid rgba(34,197,94,.35);
      background: rgba(34,197,94,.14);
    }
    .tier .pay a:hover{ background: rgba(34,197,94,.20); }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- TOP HEADER -->
    <header>
      <div class="headerTop">
        <div class="brand">
          <h1>帝國藍圖｜集資頁</h1>
          <p>
            <a href="https://www.canva.com/design/DAGxVnZDL_o/KcdbSIsW27sVgh_RrzDmWw/edit?utm_content=DAGxVnZDL_o&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton" target="_blank" rel="noopener">點我看集資報告</a>
            最新集資進度、請關注 IG 獲得最新消息：
            <a href="https://www.instagram.com/water780706/" target="_blank" rel="noopener">點我關注</a>
          </p>
          <p class="bank">
  銀行代碼：中國信託（822）、銀行帳號：705540140275<br>
  若透過上方帳號匯款贊助，請加 Line：
  <a href="https://line.me/ti/p/~water780706" target="_blank" rel="noopener">water780706</a>
  並回傳匯款通知，感謝！
</p>
        </div>
        <div class="pill" id="lastUpdated">更新時間：—</div>
      </div>

      <div class="headerProgress">
        <div class="row">
          <h2 style="margin:0; font-size:16px; letter-spacing:.4px;">目前集資進度</h2>
          <div class="pill small" id="percentPill">完成：0%</div>
        </div>

        <div class="kpi">
          <div class="box">
            <div class="muted small">目前金額</div>
            <div class="num" id="currentAmount">NT$0</div>
          </div>
          <div class="box">
            <div class="muted small">目標金額</div>
            <div class="num" id="targetAmount">NT$0</div>
          </div>
          <div class="box">
            <div class="muted small">已集資人數</div>
            <div class="num" id="backerCount">0 人</div>
          </div>
        </div>

        <div class="progress" aria-label="funding progress">
          <div class="bar" id="progressBar"></div>
        </div>

        <div class="note">
          自動加總金額並計算百分比；集資中途反悔或是中止計畫，金額會依照匯款方資料退回(註:將扣取3%手續費)。
        </div>

        <div class="btnrow">
          <button id="copyLinkBtn">複製此頁連結</button>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <div class="grid">
      <!-- Left: Backers list -->
      <section class="card">
        <div class="row">
          <h2>已集資名單</h2>
          <div class="pill small" id="listHint">格式：金額級距-方案名-匿名/姓名縮寫</div>
        </div>
        <div class="list" id="backerList"></div>
        <div class="note">感謝以上贊助者</div>
      </section>

      <!-- Right: Plans -->
      <section class="card">
        <h2>集資方案</h2>
        <div class="tiers" id="tiers"></div>
        <div class="note">
        </div>
      </section>
    </div>
  </div>

  <script>
    const CONFIG = {
      pageTitle: "帝國藍圖｜集資頁",
      targetAmount: 350000,
      updatedAt: new Date().toISOString(),
      tiers: [
        {
          key:"dad100k",
          label:"50000",
          name:"帝國藍圖爸爸",
          price:50000,
          perks:"參與品牌決策/分潤、勝利獎牌、享【帝國天使】內容。",
          imageUrl:"./50000.jpg",
          payUrl:"https://p.ecpay.com.tw/2CF4C59"
        },
        {
          key:"angel20k",
          label:"20000",
          name:"帝國天使",
          price:20000,
          perks:"參與品牌分潤、專屬繼承人、3年產品保固、達標回饋加碼，享【品牌大使】內容。",
          imageUrl:"./20000.jpg",
          payUrl:"https://p.ecpay.com.tw/317F673"
        },
        {
          key:"sales5k",
          label:"5000",
          name:"帝國大使",
          price:5000,
          perks:"推廣傭金、解鎖隱藏紀念腳色、1年產品保固、享【帝國公民】內容。",
          imageUrl:"./5000.jpg",
          payUrl:"https://p.ecpay.com.tw/AB48643"
        },
        {
          key:"citizen1k2",
          label:"1800",
          name:"帝國公民",
          price:1800,
          perks:"獲得繼承人【艾洛帝】、故事集、教學和市場圖軟墊",
          imageUrl:"./1800.jpg",
          payUrl:"https://p.ecpay.com.tw/6277398"
        },
        {
          key:"free",
          label:"自由贊助",
          name:"自由贊助",
          price:0,
          perks:"想支持多少都可以，感謝你把帝國藍圖往前推一把。",
          imageUrl:"./0.jpg",
          payUrl:"https://p.ecpay.com.tw/C71ADCC"
        },
      ],
      currency: "TWD"
    };

    const BACKERS = [
      { tierKey:"angel20k", display:"2萬-帝國天使-匿名A", at:"2026-02-02T10:10:00+08:00" },
      { tierKey:"angel20k", display:"2萬-帝國天使-志志", at:"2026-02-02T10:10:00+08:00" },
      { tierKey:"dad100k", display:"5萬-帝國藍圖爸爸-匿名B", at:"2026-02-02T09:20:00+08:00" },
      { tierKey:"sales5k", display:"5000-帝國大使-台南A", at:"2026-02-10T18:05:00+08:00" },
      { tierKey:"citizen1k2", display:"1800-帝國公民-夢貘", at:"2026-02-10T18:05:00+08:00" },
      { tierKey:"free", display:"2000-帝國公民-Fr", at:"2026-02-12T18:05:00+08:00" },
    ];

    const fmtMoney = (n) => {
      try {
        return new Intl.NumberFormat("zh-Hant-TW", { style:"currency", currency: CONFIG.currency, maximumFractionDigits:0 }).format(n);
      } catch {
        return "NT$" + Math.round(n).toLocaleString("zh-Hant-TW");
      }
    };

    const tierMap = Object.fromEntries(CONFIG.tiers.map(t => [t.key, t]));

    const validBackers = BACKERS.filter(b => tierMap[b.tierKey]);
    const current = validBackers.reduce((sum, b) => sum + (tierMap[b.tierKey].price || 0), 0);
    const percent = CONFIG.targetAmount > 0 ? Math.min(100, Math.round((current / CONFIG.targetAmount) * 100)) : 0;

    document.title = CONFIG.pageTitle;
    document.getElementById("lastUpdated").textContent =
      "更新時間：" + (CONFIG.updatedAt.includes("T") ? new Date(CONFIG.updatedAt).toLocaleString("zh-Hant-TW") : CONFIG.updatedAt);

    document.getElementById("currentAmount").textContent = fmtMoney(current);
    document.getElementById("targetAmount").textContent = fmtMoney(CONFIG.targetAmount);
    document.getElementById("backerCount").textContent = `${validBackers.length} 人`;
    document.getElementById("percentPill").textContent = `完成：${percent}%`;
    document.getElementById("progressBar").style.width = percent + "%";

    const tiersEl = document.getElementById("tiers");
    tiersEl.innerHTML = CONFIG.tiers.map(t => {
      const count = validBackers.filter(b => b.tierKey === t.key).length;

      const imgBlock = t.imageUrl
        ? `<div class="img"><img src="${t.imageUrl}" alt="${t.name}"></div>`
        : ``;

      const payBlock = t.payUrl
        ? `<div class="pay"><a href="${t.payUrl}" target="_blank" rel="noopener">立即贊助</a></div>`
        : `<div class="pay"><span class="muted small">尚未設定付款連結</span></div>`;

      const priceText = (t.price && t.price > 0) ? fmtMoney(t.price) : "自由金額";

      return `
        <div class="tier">
          <div class="top">
            <div class="badge">${t.label}</div>
            <div class="muted small">${count} 人支持</div>
          </div>
          ${imgBlock}
          <h3>${t.name}｜${priceText}</h3>
          <p>${t.perks}</p>
          ${payBlock}
        </div>
      `;
    }).join("");

    const listEl = document.getElementById("backerList");
    const sorted = [...validBackers].sort((a,b) => new Date(b.at) - new Date(a.at));
    listEl.innerHTML = sorted.map(b => {
      const t = tierMap[b.tierKey];
      const amt = (t.price && t.price > 0) ? fmtMoney(t.price) : "自由金額";
      return `
        <div class="item">
          <div class="who">${b.display}</div>
          <div class="amt">${amt}</div>
        </div>
      `;
    }).join("") || `<div class="item"><div class="muted">目前尚無名單</div></div>`;

    const pageUrl = window.location.href;
    document.getElementById("copyLinkBtn").addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(pageUrl);
        alert("已複製連結！");
      }catch(e){
        prompt("你的瀏覽器不允許自動複製，請手動複製：", pageUrl);
      }
    });
  </script>
</body>
</html>
